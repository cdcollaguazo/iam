name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-infra:
    name: Build infra
    runs-on: ubuntu-24.04
    environment: Prod
    steps:
      - name: Extract tag version
        id: tag-version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Package application
        run: |
          cd infra
          mvn clean package

      - name: Synth CloudFormation templates
        env:
          PLATFORM_NAME: ${{ vars.PLATFORM_NAME }}
          BOOTSTRAP_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/iam-bootstrap:${{ steps.tag-version.outputs.version }}
          KEYCLOAK_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/iam-keycloak:${{ steps.tag-version.outputs.version }}
          KEYCLOAK_DB_USER: ${{ secrets.KEYCLOAK_DB_USER }}
          KEYCLOAK_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_HOST: ${{ vars.KEYCLOAK_URL }}
          BSN_USERS_API_URL: ${{ vars.BSN_USERS_API_URL }}
        run: |
          cd infra
          java -jar target/infra-1.0-SNAPSHOT.jar

      - name: Upload CloudFormation templates
        uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: infra/cdk.out

  build-bootstrap:
    name: Build bootstrap
    runs-on: ubuntu-24.04
    environment: Prod
    steps:
      - name: Extract tag version
        id: tag-version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push bootstrap image to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: ./database
          file: ./database/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/iam-bootstrap:${{ steps.tag-version.outputs.version }}, ${{ secrets.DOCKERHUB_USERNAME }}/iam-bootstrap:latest

  build-keycloak:
    name: Build Keycloak
    runs-on: ubuntu-24.04
    environment: Prod
    steps:
      - name: Extract tag version
        id: tag-version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Keycloak image to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/iam-keycloak:${{ steps.tag-version.outputs.version }}, ${{ secrets.DOCKERHUB_USERNAME }}/iam-keycloak:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    needs: [build-infra, build-bootstrap, build-keycloak]
    environment: Prod
    steps:
      - name: Download CloudFormation templates
        uses: actions/download-artifact@v8
        with:
          name: cdk-out
          path: infra/cdk.out

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy IamBootstrap stack
        run: |
          aws cloudformation deploy \
            --stack-name IamBootstrap \
            --template-file infra/cdk.out/IamBootstrap.template.json \
            --capabilities CAPABILITY_IAM

      - name: Run bootstrap Task
        env:
          PLATFORM_NAME: ${{ vars.PLATFORM_NAME }}
        run: |
          set -eu

          VPC_SUBNET_1_ID=$(aws ssm get-parameter \
            --name "/${PLATFORM_NAME}/vpc/subnet-1-id" \
            --query "Parameter.Value" \
            --output text)

          VPC_SUBNET_2_ID=$(aws ssm get-parameter \
            --name "/${PLATFORM_NAME}/vpc/subnet-2-id" \
            --query "Parameter.Value" \
            --output text)

          ECS_SG_ID=$(aws ssm get-parameter \
            --name "/${PLATFORM_NAME}/vpc/ecs-sg-id" \
            --query "Parameter.Value" \
            --output text)

          ECS_CLUSTER_NAME=$(aws ssm get-parameter \
            --name "/${PLATFORM_NAME}/ecs/cluster-name" \
            --query "Parameter.Value" \
            --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER_NAME" \
            --launch-type FARGATE \
            --task-definition iam-bootstrap \
            --network-configuration "awsvpcConfiguration={subnets=[$VPC_SUBNET_1_ID,$VPC_SUBNET_2_ID],securityGroups=[$ECS_SG_ID],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Started ECS task: $TASK_ARN"
          echo "Waiting for ECS task to stop..."

          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER_NAME" \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER_NAME" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          STOPPED_REASON=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER_NAME" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' \
            --output text)

          echo "ECS task stopped"
          echo "Stopped reason: $STOPPED_REASON"
          echo "Exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            exit 1
          fi

      - name: Deploy IamService stack
        run: |
          aws cloudformation deploy \
            --stack-name IamService \
            --template-file infra/cdk.out/IamService.template.json \
            --capabilities CAPABILITY_IAM

      - name: Apply realm config
        run: |
          docker run --rm \
            -e KEYCLOAK_URL="{{ vars.KEYCLOAK_URL }}" \
            -e KEYCLOAK_USER="${{ secrets.KEYCLOAK_ADMIN_USER }}" \
            -e KEYCLOAK_PASSWORD="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            -e IMPORT_FILES_LOCATIONS=/config/* \
            -e IMPORT_VARSUBSTITUTION_ENABLED=true \
            -e PLATFORM_NAME="https://${{ vars.PLATFORM_NAME }}" \
            -e BSN_URL="${{ vars.BSN_URL }}" \
            -e MAIL_HOST="${{ vars.MAIL_HOST }}" \
            -e MAIL_PORT="${{ vars.MAIL_PORT }}" \
            -e MAIL_SSL=true \
            -e MAIL_START_TLS=true \
            -e MAIL_AUTH=true \
            -e MAIL_USER="${{ secrets.MAIL_USER }}" \
            -e MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" \
            -v "${{ github.workspace }}/realm:/config:ro" \
            adorsys/keycloak-config-cli:6.5.1-26.1.0
