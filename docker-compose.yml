# Local docker-compose.yml file

services:
  mail:
    image: maildev/maildev
    ports:
      - 1080:1080
    networks:
      - iam
    restart: unless-stopped

  db:
    image: postgres:18.0
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: keycloak
    volumes:
      - db-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD", "pg_isready"]
      start_period: 10s
    networks:
      - iam
    restart: unless-stopped

  keycloak:
    build:
      context: .
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: dev
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev
      KC_DB: postgres
      BSN_USERS_API_URL: http://host.docker.internal:8080/api/v1/users
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: dev
      KC_DB_PASSWORD: dev
      KC_HEALTH_ENABLED: true
    command: "start-dev"
    ports:
      - 9090:8080
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      start_period: 60s
    networks:
      - iam
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  config:
    image: adorsys/keycloak-config-cli:6.5.1-26.1.0
    environment:
      PLATFORM_NAME: local
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: dev
      KEYCLOAK_PASSWORD: dev
      IMPORT_FILES_LOCATIONS: /config/*
      IMPORT_VARSUBSTITUTION_ENABLED: true
      IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR: false
      BSN_URL: http://localhost:4200
      MAIL_HOST: mail
      MAIL_PORT: 1025
    volumes:
      - ./realm:/config:ro
    networks:
      - iam
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  db-data:
    driver: local

networks:
  iam:
    driver: bridge
